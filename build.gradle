// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    apply from: "${rootProject.projectDir}/config/config.gradle"
    apply from: "${rootProject.projectDir}/config/dependancies.gradle"

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 1. Bump AGP (Kotlin 2.0 requires at least 8.3.0)
        classpath("com.android.tools.build:gradle:8.3.0")

        // 2. Bump the Kotlin Gradle Plugin
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21")

        // 3. ADD the new Compose Compiler plugin to the classpath
        classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.0.21")
    }
}
plugins {
    // Apply false so it doesn't build the root project, just makes it available
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.kotlin.compose.compiler) apply false
}