[versions]

compose-bom = "2023.03.00"
compose-compiler = "1.4.3"
compose-navigation = "2.5.3"
compose-constraintlayout = "1.0.1"

room_version = "2.5.2"
kotlin_version = '1.8.10'
ksp = "1.8.10-1.0.9"

[libraries]
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room_version" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room_version" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room_version" }

# 1. The BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }

# 2. Core Libraries (No versions declared here; managed by BOM)
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-material = { group = "androidx.compose.material", name = "material" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

# 3. Exceptions (Must declare their specific versions)
compose-compiler = { group = "androidx.compose.compiler", name = "compiler", version.ref = "compose-compiler" }
compose-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "compose-constraintlayout" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "compose-navigation" }

# Optional but highly recommended: Group your core UI libraries
[bundles]
compose-core = ["compose-runtime", "compose-material", "compose-ui-tooling-preview"]

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

