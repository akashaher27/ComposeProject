[versions]
ktx_version = '1.8.0'
appcompat_version = '1.3.1'
material_version = '1.4.0'
kotlin_version = '1.8.10'
compose_version = '1.4.3'
compose_navigation = '2.5.3'
compose_constraintlayout_version = '1.0.1'
navigation_version = '2.5.3'
accompanist_version = "0.30.1"
dagger_version = '2.40.5'
desugar_version = '1.1.5'
retrofit_version = '2.9.0'
okhttp_version = '4.11.0'
coil_version = '2.3.0'
junitVersion = "4.13.2"
junit = "1.3.0"
espressoCoreVersion = "3.7.0"

[libraries]
ktx = { module = "androidx.core:core-ktx", version.ref = "ktx_version" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "material_version" }
androiMaterial = { module = "com.google.android.material:material", version.ref = "material_version" }

compiler = { module = "androidx.compose.compiler:compiler", version.ref = "compose_version" }
runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose_version" }
material = { module = "androidx.compose.material:material", version.ref = "compose_version" }
foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose_version" }
ui = { module = "androidx.compose.ui:ui", version.ref = "compose_version" }
uiUtil = { module = "androidx.compose.ui:ui-util", version.ref = "compose_version" }
uiTooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose_version" }
uiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose_version" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "compose_constraintlayout_version" }



coil = {module = "io.coil-kt:coil-compose",version.ref = "coil_version"}
junit = { group = "junit", name = "junit", version.ref = "junitVersion" }
extJunit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
espressoCore = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCoreVersion" }